<!DOCTYPE html>
<html>
<head>
    <title>Simple Interest Calculator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .calculator {
            background-color: white;
            width: 350px;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
        }

        input:focus {
            border-color: #667eea;
            outline: none;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #5568d9;
        }

        #result {
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            color: #667eea;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div class="calculator">

        <h2>Simple Interest Calculator</h2>

        <label>Principal</label>
        <input type="number" id="principal" placeholder="Enter principal amount">

        <label>Rate (%)</label>
        <input type="number" id="rate" placeholder="Enter interest rate">

        <label>Time (Years)</label>
        <input type="number" id="time" placeholder="Enter time in years">

        <button onclick="calculateInterest()">Calculate Interest</button>

        <p id="result"></p>

    </div>

    <script>
        function calculateInterest() {
            let principal = document.getElementById("principal").value;
            let rate = document.getElementById("rate").value;
            let time = document.getElementById("time").value;

            let SI = (principal * rate * time) / 100;

            document.getElementById("result").innerHTML =
                "Simple Interest = " + SI;
        }
    </script>

</body>
</html>
